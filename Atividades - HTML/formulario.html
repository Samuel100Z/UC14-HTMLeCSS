<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Formulario de Perguntas</title>
</head>
<body>
    
    <h1>Perguntas</h1>
    <br>
    <h3>Informações Basicas</h3>
    <label for="nome">SEU NOME:</label>
    <input type="text" name="nome">
    <br>
    <label for="gmail">SEU EMAIL:</label>
    <input type="email" name="gmail">
    <br>
    <label for="senha">SUA SENHA:</label>
    <input type="password" name="senha">
    <br>
    <h3>Dados Pessoais</h3>
    <br>
    <label for="nascimento">SUA DATA DE NASCIMENTO:</label>
    <input type="date" name="nascimento">
    <br>
    <label for="idade">SUA IDADE:</label>
    <input type="number" name="idade">
    <br>
    <label for="cor">SUA COR FAVORITA:</label>
    <input type="color" name="cor">
    <br>
    <h3>Preferencias</h3>
    <br>
    <label for="genero">SEU GENERO:</label>
    <input type="radio" name="genero">Masculino
    <input type="radio" name="genero">Feminino
    <input type="radio" name="genero">Outro
    <br>
    <label for="interesses">SEUS INTERESSES:</label>
    <input type="checkbox" name="interesses">Esportes
    <input type="checkbox" name="interesses">Musica
    <input type="checkbox" name="interesses">Tecnologia
    <input type="checkbox" name="interesses">Arte
    <br>
    <h3>Outros</h3>
    <br>
    <label for="arquivo">COLOQUE UM ARQUIVO:</label>
    <input type="file" name="arquivo">
    <br>
    <label for="botao">CLIQUE AQUI:</label>
    <input type="button" value="botao">

</body>
</html>
